<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Safwan Opticals</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .top-bar { display:flex; justify-content:flex-end; gap:10px; padding:12px 0; }
    .top-bar button { padding:6px 14px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .top-bar button:hover { border-color:var(--accent); color:var(--accent); }
    .top-bar button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .ar { direction:rtl; }
    @media print { .top-bar { display:none } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar" id="topbar" style="display:none">
      <button onclick="toggleLang()" id="langbtn">العربية</button>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>
    <div id="loading" class="loading"><div class="spinner"></div><p>Loading invoice details...</p></div>
    <div id="error" class="error-msg" style="display:none"><h2>Invoice Not Found</h2><p id="error-text"></p><a href="/" class="btn">Back to Home</a></div>
    <div id="invoice-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module">
    import { getSupabase, formatCurrency, numberToWords, formatDate } from '/src/utils.js'

    const sb = getSupabase()
    const params = new URLSearchParams(window.location.search)
    const id = params.get('id')
    let lang = 'en'
    let invoiceData = null

    // ─── Translations ───
    const tr = {
      en: {
        title: 'Invoice', receiptTitle: 'Receipt Voucher',
        invNo: 'Invoice #', recNo: 'Receipt #',
        date: 'Date', customer: 'Customer', phone: 'Phone', method: 'Method', status: 'Status',
        walkIn: 'Walk-in', paid: 'PAID', partial: 'PARTIAL', unpaid: 'UNPAID',
        prescription: 'Optical Prescription', eyeType: 'Eye Type', lensType: 'Lens Type',
        od: 'OD (Right)', os: 'OS (Left)', ipd: 'IPD', sph: 'SPH', cyl: 'CYL', axis: 'AXIS', add: 'ADD',
        items: 'Items', details: 'Details',
        subtotal: 'Subtotal', discount: 'Discount', total: 'Total', amt: 'Amount',
        amountPaid: 'Paid', balance: 'Balance Due',
        words: 'Saudi Riyals',
        footer: 'Verified digitally | Safwan Opticals',
        noDetails: 'No details',
        notes: 'Notes',
      },
      ar: {
        title: 'الفاتورة', receiptTitle: 'ل القبض',
        invNo: 'رقم الفاتورة', recNo: 'رقم الإيصال',
        date: 'التاريخ', customer: 'العميل', phone: 'الهاتف', method: 'الطريقة', status: 'الحالة',
        walkIn: 'عابر', paid: 'مدفوع', partial: 'جزئي', unpaid: 'غير مدفوع',
        prescription: 'الوصفة البصرية', eyeType: 'نوع العين', lensType: 'نوع العدسة',
        od: 'OD (يمين)', os: 'OS (يسار)', ipd: 'IPD', sph: 'SPH', cyl: 'CYL', axis: 'AXIS', add: 'ADD',
        items: 'العناصر', details: 'التفاصيل',
        subtotal: 'المجموع الفرعي', discount: 'الخصم', total: 'الإجمالي', amt: 'المبلغ',
        amountPaid: 'المدفوع', balance: 'المبلغ المتبقي',
        words: 'ريال سعودي',
        footer: 'تم التحقق رقمياً | صفوان للبصريات',
        noDetails: 'لا توجد تفاصيل',
        notes: 'ملاحظات',
      }
    }
    function t(key) { return tr[lang][key] || key }

    window.toggleLang = function() {
      lang = lang === 'en' ? 'ar' : 'en'
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      document.documentElement.lang = lang
      document.getElementById('langbtn').textContent = lang === 'en' ? 'العربية' : 'English'
      if (invoiceData) render(invoiceData.invoice, invoiceData.items, invoiceData.shopName)
    }

    window.downloadPDF = function() {
      const el = document.getElementById('invoice-container')
      html2pdf().set({
        margin: 10,
        filename: 'Invoice.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(el).save()
    }

    if (!sb) showError('System unavailable. Check Supabase config.')
    else if (!id) showError('No invoice ID provided')
    else loadInvoice(id)

    async function loadInvoice(id) {
      const { data: invoice, error } = await sb.from('invoices').select('*').eq('id', id).single()
      if (error) { showError('Invoice not found — ' + (error.message || '')); return }
      if (!invoice) { showError('Invoice not found'); return }
      const { data: items } = await sb.from('invoice_items').select('*').eq('invoice_id', id)
      let shopName = 'Safwan Opticals'
      try { const { data: s } = await sb.from('settings').select('*').limit(1).single(); if (s) shopName = s.shop_name || shopName } catch {}
      invoiceData = { invoice, items: items || [], shopName }
      document.getElementById('topbar').style.display = 'flex'
      render(invoice, items || [], shopName)
    }

    function render(inv, items, shopName) {
      const isReceipt = inv.invoice_type === 'receipt'
      const isOptical = inv.right_sphere != null
      const c = document.getElementById('invoice-container')
      let h = '<div class="card">'

      h += '<div class="hdr"><div class="sname">'+shopName+'</div>'
      h += '<div class="addr">Abdul Rahman Ibn Ahmad As Sidayri, As Salamah, Jeddah 23436</div>'
      h += '<div class="addr">عبد الرحمن بن أحمد السديري، السلامة، جدة</div>'
      h += '<div class="meta">VAT: 310158981300003 | Tel: +966 05 0918 3807</div></div>'

      h += '<div class="status"><span class="type">'+(isReceipt?t('receiptTitle'):t('title'))+'</span>'
      h += '<span class="badge '+inv.payment_status+'">'+t(inv.payment_status)+'</span></div>'

      h += '<div class="grid2">'
      h += '<div class="gi"><span class="lbl">'+(isReceipt?t('recNo'):t('invNo'))+'</span><span class="val">'+inv.invoice_number+'</span></div>'
      h += '<div class="gi"><span class="lbl">'+t('date')+'</span><span class="val">'+formatDate(inv.created_at)+'</span></div>'
      h += '<div class="gi"><span class="lbl">'+t('customer')+'</span><span class="val">'+(inv.customer_name||t('walkIn'))+'</span></div>'
      if (inv.customer_phone) h += '<div class="gi"><span class="lbl">'+t('phone')+'</span><span class="val">'+inv.customer_phone+'</span></div>'
      if (inv.payment_method) h += '<div class="gi"><span class="lbl">'+t('method')+'</span><span class="val">'+inv.payment_method.toUpperCase()+'</span></div>'
      h += '<div class="gi"><span class="lbl">'+t('status')+'</span><span class="val" style="color:'+(inv.payment_status==='paid'?'var(--green)':'var(--red)')+'">'+t(inv.payment_status)+'</span></div>'
      h += '</div>'

      if (isOptical) {
        h += '<div class="sec"><h4>'+t('prescription')+'</h4><div class="rx">'
        if (inv.eye_type) h += '<div class="rxr"><b>'+t('eyeType')+':</b> '+inv.eye_type+'</div>'
        if (inv.lens_type) h += '<div class="rxr"><b>'+t('lensType')+':</b> '+inv.lens_type+'</div>'
        h += '<table class="rxt"><thead><tr><th></th><th>'+t('sph')+'</th><th>'+t('cyl')+'</th><th>'+t('axis')+'</th><th>'+t('add')+'</th></tr></thead><tbody>'
        h += '<tr class="od"><td><b>'+t('od')+'</b></td><td>'+(inv.right_sphere??'-')+'</td><td>'+(inv.right_cylinder??'-')+'</td><td>'+(inv.right_axis??'-')+'</td><td>'+(inv.right_add??'-')+'</td></tr>'
        h += '<tr class="os"><td><b>'+t('os')+'</b></td><td>'+(inv.left_sphere??'-')+'</td><td>'+(inv.left_cylinder??'-')+'</td><td>'+(inv.left_axis??'-')+'</td><td>'+(inv.left_add??'-')+'</td></tr>'
        h += '</tbody></table>'
        if (inv.ipd) h += '<div class="rxr" style="font-weight:600;margin-top:8px">'+t('ipd')+': '+inv.ipd+' mm</div>'
        h += '</div></div>'
      }

      h += '<div class="sec"><h4>'+(isReceipt?t('details'):t('items'))+'</h4>'
      if (items.length > 0) {
        h += '<table class="items"><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>'
        items.forEach(i => { h += '<tr><td>'+i.description+'</td><td class="c">'+i.quantity+'</td><td class="r">'+formatCurrency(i.unit_price)+'</td><td class="r">'+formatCurrency(i.total_price)+'</td></tr>' })
        h += '</tbody></table>'
      } else h += '<p class="item-note">'+(inv.notes||t('noDetails'))+'</p>'
      h += '</div>'

      h += '<div class="totals">'
      if (!isReceipt) {
        h += '<div class="tr"><span>'+t('subtotal')+'</span><span>'+formatCurrency(inv.subtotal)+'</span></div>'
        if (Number(inv.discount)>0) h += '<div class="tr"><span>'+t('discount')+'</span><span>-'+formatCurrency(inv.discount)+'</span></div>'
        h += '<div class="tr grand"><span>'+t('total')+'</span><span>'+formatCurrency(inv.total_amount)+'</span></div>'
        h += '<div class="tr"><span>'+t('amountPaid')+'</span><span style="color:var(--green)">'+formatCurrency(inv.amount_paid)+'</span></div>'
        if (Number(inv.balance_due)>0) h += '<div class="tr"><span>'+t('balance')+'</span><span style="color:var(--red)">'+formatCurrency(inv.balance_due)+'</span></div>'
      } else h += '<div class="tr grand"><span>'+t('amt')+'</span><span>'+formatCurrency(inv.total_amount)+'</span></div>'
      h += '</div>'

      if (!isReceipt) h += '<div class="words">'+numberToWords(Math.floor(inv.total_amount))+' '+t('words')+'</div>'
      if (inv.notes) h += '<div class="notes"><b>'+t('notes')+':</b> '+inv.notes+'</div>'
      h += '<div class="ftr">'+t('footer')+'</div></div>'

      c.innerHTML = h
      document.getElementById('loading').style.display = 'none'
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('error').style.display = 'block'
      document.getElementById('error-text').textContent = msg
    }
  </script>
</body>
</html>
