<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Safwan Opticals</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="color:var(--muted);font-size:0.9rem">Loading invoice details...</p>
    </div>

    <div id="error-container" class="error-msg" style="display:none">
      <h2 style="font-size:1.25rem;margin-bottom:0.5rem;color:var(--red)">Invoice Not Found</h2>
      <p id="error-msg" style="color:var(--muted);margin-bottom:1.25rem">The invoice could not be loaded.</p>
      <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <div id="invoice-container" style="display:none"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search)
    var id = params.get('id')
    if (id) setTimeout(function() { loadInvoice(id) }, 100)
    else showError('No invoice ID provided')
  </script>
</body>
</html>
