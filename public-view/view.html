<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Safwan Opticals</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div id="loading" class="loading"><div class="spinner"></div><p>Loading invoice details...</p></div>
    <div id="error" class="error-msg" style="display:none"><h2>Invoice Not Found</h2><p id="error-text"></p><a href="/" class="btn">Back to Home</a></div>
    <div id="invoice-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { getSupabase, formatCurrency, numberToWords, formatDate } from '/src/utils.js'

    const sb = getSupabase()
    const params = new URLSearchParams(window.location.search)
    const id = params.get('id')

    if (!sb) showError('System unavailable. Check Supabase config.')
    else if (!id) showError('No invoice ID provided')
    else loadInvoice(id)

    async function loadInvoice(id) {
      const { data: invoice, error } = await sb.from('invoices').select('*').eq('id', id).single()
      if (error) {
        console.error(error)
        if (error.code === 'PGRST116') showError('Invoice not found — the record may have been deleted.')
        else if (error.code === '42501' || error.message?.includes('permission'))
          showError('Access denied. Run the public RLS migration in Supabase SQL Editor:\n\nCREATE POLICY "Public read" ON invoices FOR SELECT USING (true);')
        else showError('Error: ' + (error.message || 'Unknown'))
        return
      }
      if (!invoice) { showError('Invoice not found'); return }

      const { data: items } = await sb.from('invoice_items').select('*').eq('invoice_id', id)
      let shopName = 'Safwan Opticals'
      try { const { data: s } = await sb.from('settings').select('*').limit(1).single(); if (s) shopName = s.shop_name || shopName } catch {}
      render(invoice, items || [], shopName)
    }

    function render(inv, items, shopName) {
      const isReceipt = inv.invoice_type === 'receipt'
      const isOptical = inv.right_sphere != null
      const c = document.getElementById('invoice-container')
      let h = '<div class="card">'

      h += '<div class="hdr"><div class="sname">'+shopName+'</div><div class="addr">Abdul Rahman Ibn Ahmad As Sidayri, As Salamah, Jeddah 23436</div><div class="meta">VAT: 300833099900003 | Tel: +966 05 0918 3807</div></div>'
      h += '<div class="status"><span class="type">'+(isReceipt?'Receipt Voucher':'Invoice')+'</span><span class="badge '+inv.payment_status+'">'+inv.payment_status.toUpperCase()+'</span></div>'
      h += '<div class="grid2">'
      h += '<div class="gi"><span class="lbl">'+(isReceipt?'Receipt':'Invoice')+' #</span><span class="val">'+inv.invoice_number+'</span></div>'
      h += '<div class="gi"><span class="lbl">Date</span><span class="val">'+formatDate(inv.created_at)+'</span></div>'
      h += '<div class="gi"><span class="lbl">Customer</span><span class="val">'+(inv.customer_name||'Walk-in')+'</span></div>'
      if (inv.customer_phone) h += '<div class="gi"><span class="lbl">Phone</span><span class="val">'+inv.customer_phone+'</span></div>'
      if (inv.payment_method) h += '<div class="gi"><span class="lbl">Method</span><span class="val">'+inv.payment_method.toUpperCase()+'</span></div>'
      h += '<div class="gi"><span class="lbl">Status</span><span class="val" style="color:'+(inv.payment_status==='paid'?'var(--green)':'var(--red)')+'">'+inv.payment_status.toUpperCase()+'</span></div>'
      h += '</div>'

      if (isOptical) {
        h += '<div class="sec"><h4>Optical Prescription</h4><div class="rx">'
        if (inv.eye_type) h += '<div class="rxr"><b>Eye Type:</b> '+inv.eye_type+'</div>'
        if (inv.lens_type) h += '<div class="rxr"><b>Lens Type:</b> '+inv.lens_type+'</div>'
        h += '<table class="rxt"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th></tr></thead><tbody>'
        h += '<tr class="od"><td><b>OD (Right)</b></td><td>'+(inv.right_sphere??'-')+'</td><td>'+(inv.right_cylinder??'-')+'</td><td>'+(inv.right_axis??'-')+'</td><td>'+(inv.right_add??'-')+'</td></tr>'
        h += '<tr class="os"><td><b>OS (Left)</b></td><td>'+(inv.left_sphere??'-')+'</td><td>'+(inv.left_cylinder??'-')+'</td><td>'+(inv.left_axis??'-')+'</td><td>'+(inv.left_add??'-')+'</td></tr>'
        h += '</tbody></table>'
        if (inv.ipd) h += '<div class="rxr" style="font-weight:600;margin-top:8px">IPD: '+inv.ipd+' mm</div>'
        h += '</div></div>'
      }

      h += '<div class="sec"><h4>'+(isReceipt?'Details':'Items')+'</h4>'
      if (items.length > 0) {
        h += '<table class="items"><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>'
        items.forEach(i => { h += '<tr><td>'+i.description+'</td><td class="c">'+i.quantity+'</td><td class="r">'+formatCurrency(i.unit_price)+'</td><td class="r">'+formatCurrency(i.total_price)+'</td></tr>' })
        h += '</tbody></table>'
      } else h += '<p class="item-note">'+(inv.notes||'No details')+'</p>'
      h += '</div>'

      h += '<div class="totals">'
      if (!isReceipt) {
        h += '<div class="tr"><span>Subtotal</span><span>'+formatCurrency(inv.subtotal)+'</span></div>'
        if (Number(inv.discount)>0) h += '<div class="tr"><span>Discount</span><span>-'+formatCurrency(inv.discount)+'</span></div>'
        h += '<div class="tr grand"><span>Total</span><span>'+formatCurrency(inv.total_amount)+'</span></div>'
        h += '<div class="tr"><span>Paid</span><span style="color:var(--green)">'+formatCurrency(inv.amount_paid)+'</span></div>'
        if (Number(inv.balance_due)>0) h += '<div class="tr"><span>Balance Due</span><span style="color:var(--red)">'+formatCurrency(inv.balance_due)+'</span></div>'
      } else h += '<div class="tr grand"><span>Amount</span><span>'+formatCurrency(inv.total_amount)+'</span></div>'
      h += '</div>'

      if (!isReceipt) h += '<div class="words">'+numberToWords(Math.floor(inv.total_amount))+' Saudi Riyals</div>'
      if (inv.notes) h += '<div class="notes"><b>Notes:</b> '+inv.notes+'</div>'
      h += '<div class="ftr">Verified digitally | Safwan Opticals</div></div>'

      c.innerHTML = h
      document.getElementById('loading').style.display = 'none'
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('error').style.display = 'block'
      document.getElementById('error-text').textContent = msg
    }
  </script>
</body>
</html>
